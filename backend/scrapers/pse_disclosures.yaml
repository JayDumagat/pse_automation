name: pse_disclosures
url: https://edge.pse.com.ph/companyDisclosures/search.ax
method: GET
content_type: html
params:
  keyword: ""
  tmplNm: Declaration of Cash Dividends
  sortType: date
  dateSortType: DESC
  cmpySortType: ASC
  pageNo: "1"
headers:
  User-Agent: Mozilla/5.0
item_selector: table tr:not(:first-child)
fields:
  title:
    selector: td:nth-of-type(1)
    attr: text
    required: true
  disclosure_date:
    selector: td:nth-of-type(2)
    attr: text
